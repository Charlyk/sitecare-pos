  .tw-seg button.on { background: #fff; color: var(--sc-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function ForgotPassword() {
  const [scale, setScale] = useState(1);
  const [lang, setLang] = useState(localStorage.getItem('sc_lang') || 'ro');
  const [email, setEmail] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [sent, setSent] = useState(false);
  const [sentTo, setSentTo] = useState('');
  const [cooldown, setCooldown] = useState(0);
  const [online, setOnline] = useState(true);
  const [tweaksOn, setTweaksOn] = useState(false);
  const [accent, setAccent] = useState(localStorage.getItem('sc_accent') || 'sage');
  const [bg, setBg] = useState(localStorage.getItem('sc_login_bg') || 'arcs');

  const t = STRINGS[lang];

  useEffect(() => localStorage.setItem('sc_lang', lang), [lang]);
  useEffect(() => localStorage.setItem('sc_accent', accent), [accent]);
  useEffect(() => localStorage.setItem('sc_login_bg', bg), [bg]);

  useEffect(() => {
    const fit = () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      setScale(Math.min((vw - 32) / 1440, (vh - 32) / 900, 1));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  useEffect(() => {
    const map = {
      sage: { primary: 'hsl(120 14% 49%)', hover: 'hsl(120 14% 42%)' },
      indigo: { primary: 'hsl(230 50% 55%)', hover: 'hsl(230 50% 48%)' },
      terracotta: { primary: 'hsl(0 53% 52%)', hover: 'hsl(0 53% 45%)' },
      charcoal: { primary: 'hsl(120 8% 25%)', hover: 'hsl(120 8% 18%)' },
    };
    const c = map[accent] || map.sage;
    document.documentElement.style.setProperty('--sc-primary', c.primary);
    document.documentElement.style.setProperty('--sc-primary-hover', c.hover);
  }, [accent]);

  useEffect(() => {
    const h = e => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweaksOn(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', h);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', h);
  }, []);

  // Resend cooldown
  useEffect(() => {
    if (cooldown <= 0) return;
    const id = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(id);
  }, [cooldown]);

  const onSubmit = (e) => {
    e && e.preventDefault();
    setError(null);
    if (!isValidEmail(email)) { setError('email'); return; }
    setBusy(true);
    // Simulate API call — always "succeeds" to prevent account enumeration
    setTimeout(() => {
      setBusy(false);
      setSentTo(email);
      setSent(true);
      setCooldown(45);
    }, 900);
  };

  const onResend = () => {
    if (cooldown > 0) return;
    setCooldown(45);
    // fire and forget — would re-hit API in real build
  };

  const onUseDifferent = () => {
    setSent(false);
    setEmail('');
    setError(null);
    setCooldown(0);
  };

  const Icon = window.Icon;
  const canSubmit = email && !busy;

  return (
    <div className="desktop-stage">
      <div className="desktop-frame" style={{ transform: `scale(${scale})` }}>
        <div className="win">
          <div className="titlebar">
            <div className="tl-group"><div className="tl-dot tl-close" /><div className="tl-dot tl-min" /><div className="tl-dot tl-max" /></div>
            <div className="title-text"><span className="hand">SiteCare</span> POS · {lang === 'ro' ? 'Resetare parolă' : 'Password reset'}</div>
          </div>

          <div className="body-grid">
            {/* Brand panel */}
            <div className="brand-panel">
              {bg === 'arcs' && <><div className="arc" /><div className="arc2" /></>}

              <div className="brand-top">
                <div className="brand-logo">S</div>
                <div>
                  <div className="brand-name"><span>Site</span><b>Care</b></div>
                  <div className="brand-sub">POS</div>
                </div>
              </div>

              <div className="brand-hero">
                <div className="brand-eyebrow">{lang === 'ro' ? 'parole se mai uită' : 'passwords happen'}</div>
                <h1 className="brand-title">{t.hero_a}<br/><em>{t.hero_b}</em></h1>
                <p className="brand-lead">{t.hero_lead}</p>

                <div className="steps">
                  <div className={`step ${!sent ? 'active' : 'done'}`}>
                    <div className="n">{sent ? <Icon name="check" size={14} /> : '1'}</div>
                    <div><h4>{t.step1_t}</h4><p>{t.step1_p}</p></div>
                  </div>
                  <div className={`step ${sent ? 'active' : ''}`}>
                    <div className="n">2</div>
                    <div><h4>{t.step2_t}</h4><p>{t.step2_p}</p></div>
                  </div>
                  <div className="step">
                    <div className="n">3</div>
                    <div><h4>{t.step3_t}</h4><p>{t.step3_p}</p></div>
                  </div>
                </div>
              </div>

              <div className="key-card">
                <div className="hdr">
                  <div className="tag"><Icon name="settings" size={14} /> {t.key_tag}</div>
                  <div className="tm">{t.key_time}</div>
                </div>
                <div className="row"><span className="k">{t.key_row1}</span><span className="v">{t.key_row1v}</span></div>
                <div className="row"><span className="k">{t.key_row2}</span><span className="v">{t.key_row2v}</span></div>
                <div className="row"><span className="k">{t.key_row3}</span><span className="v">{t.key_row3v}</span></div>
                <div className="stamp">{t.key_stamp}</div>
              </div>

              <div className="brand-foot">
                <div><span className="online-dot" /> SiteCare Cloud · eu-central</div>
                <div className="links">
                  <a href="#" onClick={e=>e.preventDefault()}>{t.terms}</a>
                  <a href="#" onClick={e=>e.preventDefault()}>{t.privacy}</a>
                  <a href="#" onClick={e=>e.preventDefault()}>{t.support}</a>
                </div>
              </div>
            </div>

            {/* Form panel */}
            <div className="form-panel">
              <div className="form-topleft">
                <a href="login.html" className="back-link">
                  <Icon name="arrowLeft" size={14} /> {t.back}
                </a>
              </div>
              <div className="form-top">
                <button onClick={() => setOnline(!online)} className="status-pill" style={{ background: online ? 'hsl(120 14% 49% / 0.1)' : 'hsl(38 92% 50% / 0.12)', color: online ? 'var(--sc-primary)' : 'hsl(30 80% 38%)' }}>
                  <span className="d" style={{ background: online ? 'var(--sc-primary)' : 'hsl(30 80% 45%)' }} />
                  {online ? t.online : (lang === 'ro' ? 'Offline' : 'Offline')}
                </button>
                <div className="lang-seg">
                  <button className={lang === 'ro' ? 'on' : ''} onClick={() => setLang('ro')}>RO</button>
                  <button className={lang === 'en' ? 'on' : ''} onClick={() => setLang('en')}>EN</button>
                </div>
              </div>

              {!sent ? (
                <form className="form-wrap" onSubmit={onSubmit}>
                  <div className="welcome-eyebrow">{t.eyebrow}</div>
                  <h2 className="welcome-title">{t.title}</h2>
                  <p className="welcome-sub">{t.sub}</p>

                  <div className="field">
                    <label>{t.email}</label>
                    <div className={`field-input ${error === 'email' ? 'err' : ''}`}>
                      <span className="ico"><Icon name="users" size={16} /></span>
                      <input type="email" autoFocus autoComplete="email" placeholder={t.email_ph} value={email}
                        onChange={e => { setEmail(e.target.value); setError(null); }} />
                    </div>
                    {error === 'email' && <div className="field-error"><Icon name="alert" size={12} /> {t.err_email}</div>}
                  </div>

                  <button type="submit" className="primary-btn" disabled={!canSubmit}>
                    {busy ? (
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
                        <Spinner /> {t.sending}
                      </span>
                    ) : (
                      <>
                        <Icon name="check" size={16} /> {t.send_btn}
                      </>
                    )}
                  </button>

                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 26, fontSize: 13, color: 'var(--sc-muted-foreground)' }}>
                    <span>{t.need_help}</span>
                    <a href="mailto:support@sitecare.ro" style={{ color: 'var(--sc-primary)', textDecoration: 'none', fontWeight: 700 }}>
                      {t.contact} →
                    </a>
                  </div>
                </form>
              ) : (
                <div className="form-wrap sent-wrap">
                  <div className="sent-mark">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="3" y="5" width="18" height="14" rx="2.5" />
                      <path d="M3 7l9 6 9-6" />
                    </svg>
                  </div>

                  <div className="welcome-eyebrow">{t.sent_eyebrow}</div>
                  <h2 className="welcome-title">{t.sent_title}</h2>
                  <p className="welcome-sub">{t.sent_sub}</p>

                  <div>
                    <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--sc-muted-foreground)', marginBottom: 6 }}>
                      {t.sent_to_label}
                    </div>
                    <div className="sent-to">
                      <Icon name="check" size={14} />
                      <span className="addr">{sentTo}</span>
                    </div>
                  </div>

                  <ul className="info-list">
                    <li>
                      <span className="bul"><Icon name="clock" size={12} /></span>
                      <span><b>{t.info1_t}.</b> {t.info1_p}</span>
                    </li>
                    <li>
                      <span className="bul"><Icon name="search" size={12} /></span>
                      <span><b>{t.info2_t}.</b> {t.info2_p} <b>no-reply@sitecare.ro</b>.</span>
                    </li>
                    <li>
                      <span className="bul"><Icon name="alert" size={12} /></span>
                      <span><b>{t.info3_t}</b> {t.info3_p}</span>
                    </li>
                  </ul>

                  <button type="button" className="ghost-btn" onClick={() => window.open('mailto:', '_blank')}>
                    <Icon name="chevRight" size={14} /> {t.open_mail}
                  </button>

                  <div className="resend-row">
                    <span>{t.didnt}</span>
                    <div style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
                      <button type="button" onClick={onUseDifferent}>{t.use_diff}</button>
                      <span style={{ opacity: 0.4 }}>·</span>
                      <button type="button" onClick={onResend} disabled={cooldown > 0}>
                        {cooldown > 0 ? `${t.resend_in} ${cooldown}s` : t.resend}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <div className="signature">{t.signed} <b>♥</b> {t.heart}</div>
            </div>
          </div>
        </div>
      </div>

      {tweaksOn && (
        <div className="tweaks-panel">
          <h4>Tweaks <span style={{ fontFamily: 'Caveat', color: 'var(--sc-terracotta)', fontSize: 16 }}>live</span></h4>
          <div className="tw-row">
            <div className="tw-label">State</div>
            <div className="tw-seg">
              <button className={!sent ? 'on' : ''} onClick={() => setSent(false)}>Form</button>
              <button className={sent ? 'on' : ''} onClick={() => { setSent(true); setSentTo(email || 'chef@restaurant.ro'); }}>Sent</button>
            </div>
          </div>
          <div className="tw-row">
            <div className="tw-label">Language</div>
            <div className="tw-seg">
              <button className={lang === 'ro' ? 'on' : ''} onClick={() => { setLang('ro'); save({ lang: 'ro' }); }}>Română</button>
              <button className={lang === 'en' ? 'on' : ''} onClick={() => { setLang('en'); save({ lang: 'en' }); }}>English</button>
            </div>
          </div>
          <div className="tw-row">
            <div className="tw-label">Accent</div>
            <div className="tw-seg">
              <button className={accent === 'sage' ? 'on' : ''} onClick={() => { setAccent('sage'); save({ accent: 'sage' }); }}>Sage</button>
              <button className={accent === 'terracotta' ? 'on' : ''} onClick={() => { setAccent('terracotta'); save({ accent: 'terracotta' }); }}>Terra</button>
              <button className={accent === 'indigo' ? 'on' : ''} onClick={() => { setAccent('indigo'); save({ accent: 'indigo' }); }}>Indigo</button>
              <button className={accent === 'charcoal' ? 'on' : ''} onClick={() => { setAccent('charcoal'); save({ accent: 'charcoal' }); }}>Coal</button>
            </div>
          </div>
          <div className="tw-row">
            <div className="tw-label">Brand panel</div>
            <div className="tw-seg">
              <button className={bg === 'arcs' ? 'on' : ''} onClick={() => { setBg('arcs'); save({ bg: 'arcs' }); }}>Arcs</button>
              <button className={bg === 'plain' ? 'on' : ''} onClick={() => { setBg('plain'); save({ bg: 'plain' }); }}>Plain</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Spinner() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style={{ animation: 'spin 900ms linear infinite' }}>
      <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.3)" strokeWidth="3" />
      <path d="M21 12a9 9 0 0 0-9-9" stroke="#fff" strokeWidth="3" strokeLinecap="round" />
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </svg>
  );
}

function save(edits) {
  try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*'); } catch(e) {}
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "ro",
  "accent": "sage",
  "bg": "arcs"
}/*EDITMODE-END*/;

ReactDOM.createRoot(document.getElementById('root')).render(<ForgotPassword />);
</script>
</body>
</html>
