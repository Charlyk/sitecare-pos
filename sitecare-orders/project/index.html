<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SiteCare POS — Orders</title>
<link rel="stylesheet" href="assets/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Outfit', system-ui, sans-serif; color: var(--sc-foreground); overflow: hidden; }
  * { box-sizing: border-box; }

  /* Desktop stage — letterboxed so the "desktop app" looks like it's running on a workstation */
  .desktop-stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at top, #2a2a2a 0%, #111 60%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .desktop-frame {
    width: 1440px; height: 900px;
    transform-origin: center center;
    position: relative;
  }

  /* Window chrome */
  .win {
    width: 100%; height: 100%;
    background: var(--sc-background);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 8px 30px rgba(0,0,0,0.4);
    display: grid;
    grid-template-rows: 38px 1fr;
  }
  .titlebar {
    background: linear-gradient(180deg, #f3eee4 0%, #ece6d7 100%);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex; align-items: center; padding: 0 14px; gap: 10px;
    -webkit-app-region: drag;
    position: relative;
  }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.12); }
  .tl-close { background: #ff5f57; }
  .tl-min { background: #febc2e; }
  .tl-max { background: #28c840; }
  .tl-group { display: flex; gap: 8px; }
  .title-text {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; color: #555;
    letter-spacing: 0.01em;
  }
  .title-text .hand { font-family: 'Caveat', cursive; color: var(--sc-terracotta); font-size: 16px; font-weight: 700; margin-right: 6px; }

  /* App layout */
  .app-body { display: grid; grid-template-columns: 240px 1fr; height: 100%; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    background: linear-gradient(180deg, #fbf6ea 0%, #f7f1e1 100%);
    border-right: 1px solid hsl(120 10% 88%);
    display: flex; flex-direction: column;
    padding: 18px 14px 14px;
    gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .brand-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--sc-primary); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 16px; }
  .brand-name { font-size: 18px; letter-spacing: -0.02em; }
  .brand-name b { font-weight: 900; }
  .brand-sub { font-family: 'Caveat', cursive; color: var(--sc-terracotta); font-size: 13px; font-weight: 700; line-height: 1; margin-top: -2px; }

  .nav-group-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--sc-muted-foreground); padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
    color: #3b3a36; font-size: 14px; font-weight: 500;
    transition: background 150ms, color 150ms;
    position: relative;
  }
  .nav-item:hover { background: rgba(0,0,0,0.04); }
  .nav-item.active { background: var(--sc-primary); color: #fff; box-shadow: 0 2px 8px rgba(123,145,123,0.35); }
  .nav-item.active .count { background: rgba(255,255,255,0.2); color: #fff; }
  .nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item .label { flex: 1; }
  .nav-item .count {
    background: hsl(120 14% 49% / 0.12); color: var(--sc-primary);
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    min-width: 22px; text-align: center;
  }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sc-terracotta); }

  .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid hsl(120 10% 88%); }
  .user-chip {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; cursor: pointer;
  }
  .user-chip:hover { background: rgba(0,0,0,0.04); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--sc-terracotta); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; background: var(--sc-background); }

  /* Topbar */
  .topbar {
    height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid hsl(120 10% 88%);
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
  }
  .topbar-title { font-weight: 900; font-size: 22px; letter-spacing: -0.02em; }
  .topbar-spacer { flex: 1; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid hsl(120 10% 88%); border-radius: 10px;
    padding: 8px 12px; width: 280px;
    font-size: 13px; color: var(--sc-muted-foreground);
  }
  .search input { border: 0; outline: 0; background: transparent; flex: 1; font: inherit; color: var(--sc-foreground); }

  .kbd { border: 1px solid hsl(120 10% 88%); background: #f7f1e1; border-radius: 4px; padding: 1px 5px; font-size: 10px; color: var(--sc-muted-foreground); font-family: 'Outfit', sans-serif; font-weight: 600; }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid hsl(120 10% 88%);
    background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: #444; position: relative;
    transition: background 150ms;
  }
  .icon-btn:hover { background: #fafafa; }
  .icon-btn .bubble { position: absolute; top: -4px; right: -4px; background: var(--sc-terracotta); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px; border: 2px solid #fff; }

  .btn-primary {
    height: 38px; padding: 0 18px; border-radius: 10px; border: 0;
    background: var(--sc-primary); color: #fff; font-weight: 700; font-size: 13px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    font-family: inherit;
    transition: background 150ms;
  }
  .btn-primary:hover { background: hsl(120 14% 42%); }
  .btn-secondary {
    height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid hsl(120 10% 88%);
    background: #fff; color: #3b3a36; font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font-family: inherit;
    transition: background 150ms;
  }
  .btn-secondary:hover { background: #fafafa; }
  .btn-ghost {
    height: 36px; padding: 0 12px; border-radius: 8px; border: 0;
    background: transparent; color: #3b3a36; font-weight: 500; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: inherit;
  }
  .btn-ghost:hover { background: rgba(0,0,0,0.04); }
  .btn-terracotta {
    height: 38px; padding: 0 18px; border-radius: 999px; border: 0;
    background: var(--sc-terracotta); color: #fff; font-weight: 700; font-size: 13px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font-family: inherit;
  }
  .btn-terracotta:hover { background: hsl(0 53% 52%); }

  /* Role switcher */
  .role-pill {
    display: inline-flex; background: #fff; border: 1px solid hsl(120 10% 88%);
    border-radius: 999px; padding: 3px; gap: 2px;
  }
  .role-pill button {
    border: 0; background: transparent; padding: 6px 14px; border-radius: 999px;
    font-weight: 600; font-size: 12px; cursor: pointer; color: var(--sc-muted-foreground);
    font-family: inherit;
    display: flex; align-items: center; gap: 6px;
    transition: all 150ms;
  }
  .role-pill button.active { background: var(--sc-primary); color: #fff; }

  /* Content area */
  .content { flex: 1; overflow: auto; }
  .content-pad { padding: 24px; }

  /* Cards */
  .card { background: #fff; border: 1px solid hsl(120 10% 90%); border-radius: 16px; }
  .card.shadow { box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

  /* Chips / badges */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    letter-spacing: 0.01em;
  }
  .chip-sage { background: hsl(120 14% 49% / 0.14); color: hsl(120 14% 32%); }
  .chip-terra { background: hsl(0 53% 58% / 0.14); color: hsl(0 53% 42%); }
  .chip-amber { background: hsl(38 92% 50% / 0.14); color: hsl(30 80% 38%); }
  .chip-slate { background: hsl(210 15% 90%); color: hsl(215 25% 27%); }
  .chip-red   { background: hsl(0 84% 60% / 0.12); color: hsl(0 72% 45%); }
  .chip-blue  { background: hsl(210 80% 55% / 0.12); color: hsl(210 75% 38%); }
  .chip-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Hand-drawn eyebrow */
  .eyebrow { font-family: 'Caveat', cursive; color: var(--sc-terracotta); font-weight: 700; font-size: 18px; line-height: 1; }

  /* Scrollbar */
  .content::-webkit-scrollbar, .scroll-y::-webkit-scrollbar { width: 10px; height: 10px; }
  .content::-webkit-scrollbar-thumb, .scroll-y::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

  /* Toast */
  .toast-stack { position: absolute; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 100; pointer-events: none; }
  .toast {
    background: #fff; border: 1px solid hsl(120 10% 88%); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    min-width: 260px; pointer-events: auto;
    animation: slideIn 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .toast-icon { width: 32px; height: 32px; border-radius: 8px; background: hsl(120 14% 49% / 0.12); display: flex; align-items: center; justify-content: center; color: var(--sc-primary); }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; bottom: 20px; right: 20px;
    width: 260px; background: #fff; border: 1px solid hsl(120 10% 88%); border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    padding: 16px;
    z-index: 10000;
    font-family: 'Outfit', sans-serif;
  }
  .tweaks-panel h4 { margin: 0 0 12px; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: space-between; }
  .tweaks-panel .tw-row { margin-bottom: 10px; }
  .tweaks-panel .tw-label { font-size: 11px; font-weight: 600; color: var(--sc-muted-foreground); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .tw-seg { display: flex; background: #f7f1e1; border-radius: 8px; padding: 2px; gap: 2px; }
  .tw-seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; color: #555; }
  .tw-seg button.on { background: #fff; color: var(--sc-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  /* Density */
  .density-compact .card { padding-block: 0; }

  /* Animations */
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 hsl(0 53% 58% / 0.5); }
    70% { box-shadow: 0 0 0 10px hsl(0 53% 58% / 0); }
    100% { box-shadow: 0 0 0 0 hsl(0 53% 58% / 0); }
  }
  .pulse { animation: pulseRing 1.6s infinite; }

</style>
